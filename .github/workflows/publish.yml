name: Publish @tarun1515/jp-shared

# Publishes on a version tag only — never on a push to main.
#
# The tag IS the release trigger, which is what keeps the published version and
# the git history in step: there is no way to publish something that is not
# tagged, and no way to tag without deciding on a version.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@tarun1515'

      - name: Install
        run: npm ci

      # Fails the run if the tag and package.json disagree. Without this it is
      # entirely possible to tag v1.2.0 and publish 1.1.0, and then spend an
      # afternoon working out why an app that installed "the latest" did not get
      # the fix. Unpublishing from GitHub Packages is painful, so this is
      # checked BEFORE the build rather than after.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # Same reasoning, one level deeper: the constant apps log at runtime must
      # match the version they installed, or the drift check compares two
      # numbers that agree with each other and with nothing real.
      - name: JP_SHARED_VERSION must match package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          SRC="$(grep -oP "JP_SHARED_VERSION = '\K[^']+" src/lib/version.ts)"
          echo "package.json=$PKG  version.ts=$SRC"
          if [ "$SRC" != "$PKG" ]; then
            echo "::error::src/lib/version.ts says $SRC but package.json says $PKG. Run npm run version:bump."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Show what is about to be published
        working-directory: dist/jp-shared
        run: npm pack --dry-run

      - name: Publish
        working-directory: dist/jp-shared
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

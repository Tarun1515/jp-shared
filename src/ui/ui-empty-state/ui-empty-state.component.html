<div class="empty" [class.empty--compact]="compact()">
  <span class="empty__icon" aria-hidden="true">{{ icon() }}</span>

  <p class="empty__title">{{ title() }}</p>

  @if (message(); as text) {
    <p class="empty__message">{{ text }}</p>
  }

  @if (actionLabel(); as label) {
    <button
      type="button"
      class="btn btn--primary empty__action"
      [disabled]="actionDisabled()"
      (click)="action.emit()"
    >
      {{ label }}
    </button>
  }

  <!--
    The timeline line. Sits UNDER the action because it explains the button
    above it — "this is where it will be, and this is when".
  -->
  @if (note(); as text) {
    <p class="empty__note">{{ text }}</p>
  }

  <!-- Extra content, for anything richer than a single button. -->
  <ng-content />
</div>

<div class="field password">
  <div class="field__label-row">
    <label class="field__label" [for]="inputId()">
      {{ label() }}
      @if (!required()) {
        <span class="field__optional">Optional</span>
      }
    </label>

    <ng-content select="[fieldAction]" />
  </div>

  <input
    class="form-control"
    [id]="inputId()"
    [type]="visible() ? 'text' : 'password'"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-required]="required()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  <!--
    Only once there is something to show. An empty field offering to reveal
    nothing is a control that reads as broken before it has been used.

    aria-pressed rather than swapping the label between "Show" and "Hide" only:
    the visible text tells a sighted user what will happen, the pressed state
    tells a screen reader what IS happening.
  -->
  @if (value()) {
    <button
      type="button"
      class="password__toggle"
      [attr.aria-pressed]="visible()"
      [attr.aria-controls]="inputId()"
      (click)="toggle()"
    >
      {{ visible() ? 'Hide' : 'Show' }}
    </button>
  }

  @if (showStrength() && value()) {
    <div class="strength" [id]="inputId() + '-strength'" aria-live="polite">
      <div class="strength__cells" aria-hidden="true">
        @for (cell of [1, 2, 3, 4]; track cell) {
          <span
            class="strength__cell"
            [class.strength__cell--on]="cell <= strength().score"
            [style.--jp-meter]="strength().colour"
          ></span>
        }
      </div>

      <span class="strength__label">{{ strength().label }}</span>
    </div>
  }

  @if (helper() && !error()) {
    <p class="field__helper" [id]="inputId() + '-helper'">{{ helper() }}</p>
  }

  @if (error(); as message) {
    <p class="field__error" [id]="inputId() + '-error'">{{ message }}</p>
  }
</div>
